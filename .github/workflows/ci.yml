name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phyllotaxis-community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: runner-phyllotaxis
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Validate public contracts
        run: nix flake check
