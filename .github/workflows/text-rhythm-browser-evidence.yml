name: TEXT-001 Static Browser Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/text-rhythm-browser-evidence.yml'
      - 'docs/examples/text-rhythm-comparison.html'
      - 'tools/text-rhythm-browser-evidence.mjs'
      - 'flake.nix'
      - 'flake.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/text-rhythm-browser-evidence.yml'
      - 'docs/examples/text-rhythm-comparison.html'
      - 'tools/text-rhythm-browser-evidence.mjs'
      - 'flake.nix'
      - 'flake.lock'

permissions:
  contents: read

concurrency:
  group: phyllotaxis-text-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  text-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Static text browser measurements
        env:
          EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          nix develop .#browser-evidence --command
          node tools/text-rhythm-browser-evidence.mjs
          --fixture docs/examples/text-rhythm-comparison.html
          --output artifacts/text-rhythm
      - name: Verify failure artifact
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          if nix develop .#browser-evidence --command node tools/text-rhythm-browser-evidence.mjs \
              --fixture "$scratch/absent.html" --output "$scratch/evidence"; then
            echo 'Unexpected success with nonexistent fixture' >&2
            exit 1
          fi
          nix develop .#browser-evidence --command node -e '
            const fs=require("node:fs");
            const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(j.status!=="failed"||j.notRunCases!==8||!j.failure||j.cases.length)process.exit(1);
          ' "$scratch/evidence/evidence.json"
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: text001-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/text-rhythm/
          if-no-files-found: warn
          retention-days: 14
