name: Pages demo gallery

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/examples/**'
      - 'tools/check-demo-site.py'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: phyllotaxis-demo-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public gallery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
        with:
          persist-credentials: false

      - name: Install Nix bootstrap
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Build pinned public site
        run: |
          nix flake check
          nix build .#demo-site --out-link ./demo-output
          mkdir -p ./_site
          cp -RL ./demo-output/. ./_site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ./_site

  deploy:
    name: Publish reviewed main
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy from exact main build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify published TEXT-001 review URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          url="${PAGE_URL%/}/examples/text-rhythm-comparison.html"
          target="$RUNNER_TEMP/text-rhythm-published.html"
          for attempt in $(seq 1 20); do
            if curl --fail --location --silent --show-error \
                --connect-timeout 5 --max-time 15 "$url" --output "$target" &&
                grep -Fq 'TEXT-001: semantic text rhythm comparison' "$target"; then
              echo "Verified review page: $url"
              printf '[TEXT-001 static review page](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo "TEXT-001 Pages URL could not be verified: $url" >&2
          exit 1

