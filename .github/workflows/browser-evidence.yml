name: Browser Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/browser-evidence.yml"
      - "flake.nix"
      - "flake.lock"
      - "tools/dimensional-utility-evidence.mjs"
      - "docs/examples/dimensional-utility-reference.html"
      - "docs/examples/dimensional-utility-boundaries.html"
      - "docs/architecture/dimensional-utility-*.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/browser-evidence.yml"
      - "flake.nix"
      - "flake.lock"
      - "tools/dimensional-utility-evidence.mjs"
      - "docs/examples/dimensional-utility-reference.html"
      - "docs/examples/dimensional-utility-boundaries.html"
      - "docs/architecture/dimensional-utility-*.md"

permissions:
  contents: read

concurrency:
  group: phyllotaxis-community-browser-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dimensional-utility:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Nix bootstrap
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Produce reproducible browser evidence
        env:
          EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          nix develop .#browser-evidence --command
          node tools/dimensional-utility-evidence.mjs
          --output artifacts/dimensional-utility

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dimensional-utility-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/dimensional-utility/
          if-no-files-found: warn
          retention-days: 14
