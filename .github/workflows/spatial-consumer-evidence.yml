name: SPACE-001 Pinned Consumer Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/spatial-consumer-evidence.yml"
      - "tools/spatial-consumer-evidence.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/spatial-consumer-evidence.yml"
      - "tools/spatial-consumer-evidence.mjs"

permissions:
  contents: read

concurrency:
  group: phyllotaxis-space-consumers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer-spatial-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Render immutable public consumer pages
        env:
          EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          nix develop .#browser-evidence --command
          node tools/spatial-consumer-evidence.mjs
          --output artifacts/space-consumers
          --source-sha "$EVIDENCE_SOURCE_SHA"
      - name: Upload consumer evidence (including failures)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: space-consumers-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/space-consumers/
          if-no-files-found: warn
          retention-days: 14
